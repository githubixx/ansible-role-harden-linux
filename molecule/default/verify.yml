---
- name: Verify sshguard
  hosts: all
  tasks:
    - name: Get sshguard status
      ansible.builtin.systemd:
        service: sshguard
        state: started
      register: sshguard__status

    - name: Ensure sshguard is started
      ansible.builtin.assert:
        that:
          - sshguard__status.state == "started"

- name: Verify systemd-timesyncd
  hosts: timesyncd
  tasks:
    - name: Get systemd-timesyncd status
      ansible.builtin.systemd:
        service: systemd-timesyncd.service
        state: started
      register: timesyncd__status

    - name: Ensure systemd-timesyncd is started
      ansible.builtin.assert:
        that:
          - timesyncd__status.state == "started"

    - name: Get systemd-timesyncd enabled state
      ansible.builtin.command:
        cmd: systemctl is-enabled systemd-timesyncd.service
      register: timesyncd__enabled
      changed_when: false

    - name: Ensure systemd-timesyncd is enabled
      ansible.builtin.assert:
        that:
          - timesyncd__enabled.stdout == "enabled"

    - name: Ensure systemd-timesyncd drop-in exists when configured
      ansible.builtin.stat:
        path: /etc/systemd/timesyncd.conf.d/99-harden-linux-timesyncd.conf
      register: timesyncd__dropin
      when:
        - harden_linux_ntp_settings is defined

    - name: Ensure systemd-timesyncd drop-in is present when configured
      ansible.builtin.assert:
        that:
          - timesyncd__dropin.stat.exists
      when:
        - harden_linux_ntp_settings is defined

    - name: Ensure systemd-timesyncd settings are effective
      ansible.builtin.lineinfile:
        path: /etc/systemd/timesyncd.conf.d/99-harden-linux-timesyncd.conf
        regexp: "{{ harden_linux__ntp_setting }}"
        line: "{{ harden_linux_ntp_settings[harden_linux__ntp_setting] }}"
        state: present
      check_mode: true
      register: timesyncd__settings_status
      loop: "{{ harden_linux_ntp_settings | default({}) | flatten }}"
      loop_control:
        loop_var: harden_linux__ntp_setting
      when:
        - harden_linux_ntp_settings is defined

    - name: Ensure only systemd-timesyncd is active among NTP backends
      ansible.builtin.shell: |
        active_count=0
        for unit in ntp.service openntpd.service ntpd-rs.service systemd-timesyncd.service; do
          if systemctl is-active "$unit" >/dev/null 2>&1; then
            active_count=$((active_count + 1))
          fi
        done
        echo "$active_count"
      register: timesyncd__active_backends
      changed_when: false

    - name: Ensure exactly one NTP backend is active for timesyncd hosts
      ansible.builtin.assert:
        that:
          - timesyncd__active_backends.stdout == "1"

