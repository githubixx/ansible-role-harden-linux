---
- name: Populate service facts
  ansible.builtin.service_facts:

- name: (ntpd-rs) Disable other ntp services
  ansible.builtin.service:
    name: "{{ item }}"
    state: "stopped"
    enabled: "no"
  loop:
    - ntp.service
    - openntpd.service
    - systemd-timesyncd.service
  when:
    - ansible_facts.services[item] is defined
    - ansible_facts.services[item].status | default('') != 'not-found'

- name: (ntpd-rs) Install package
  ansible.builtin.package:
    name: ntpd-rs
    state: present

- name: (ntpd-rs) Adjust ntp.toml settings
  ansible.builtin.lineinfile:
    dest: "{{ harden_linux_ntpd_rs_config_file }}"
    regexp: "{{ item }}"
    line: "{{ harden_linux_ntp_settings[item] }}"
    state: "present"
  notify: "Restart ntpd"
  loop: "{{ harden_linux_ntp_settings | flatten }}"
  when:
    - harden_linux_ntp_settings is defined

- name: (ntpd-rs) Enable systemd service
  ansible.builtin.service:
    name: "ntpd-rs"
    state: "started"
    enabled: "yes"
