---
- name: Install sshguard package
  ansible.builtin.package:
    name: sshguard
    state: present
  tags:
    - sshguard

- name: Register sshd port setting in ssd_config
  ansible.builtin.shell: "grep -E '^Port ' /etc/ssh/sshd_config || echo 'Port 22'"
  register: harden_linux__ssh_port_tmp
  changed_when: false
  failed_when: false
  tags:
    - sshguard

- name: Register sshd port fact
  ansible.builtin.set_fact:
    harden_linux__ssh_port: "{{ harden_linux__ssh_port_tmp.stdout.split()[1] | trim }}"
  tags:
    - sshguard

- name: Include tasks for OSes
  ansible.builtin.include_tasks:
    file: "{{ item }}"
    apply:
      tags:
        - wg-install
  with_first_found:
    - "sshguard-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    - "sshguard-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_version'] }}.yml"
    - "sshguard-{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_release'] }}.yml"
    - "sshguard-{{ ansible_facts['distribution'] | lower }}.yml"
    - "sshguard-{{ ansible_facts['os_family'] | lower }}.yml"
  tags:
    - sshguard
